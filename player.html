<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>NESS Lift Video Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #070b12;
      overflow: hidden;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="yt"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen
  ></iframe>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var raw = (params.get('v') || '').trim();
      var valid = /^[A-Za-z0-9_-]{11}$/.test(raw) ? raw : 'IZxyjW7MPJQ';
      var origin = encodeURIComponent(window.location.origin);
      document.getElementById('yt').src =
        'https://www.youtube-nocookie.com/embed/' + valid +
        '?playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=' + origin;
    })();
  </script>
</body>
</html>
